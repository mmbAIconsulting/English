<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inglés en 12 semanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7efe6; --bg2:#fbf6f0; --card:#fffaf5; --card2:#f8eee3; --ink:#171c26; --muted:#7a7470; --line:#ead9c6;
  --acc:#e0622a; --acc-d:#c4301c; --acc-soft:#fde4d6; --acc-line:#f0b394; --pron:#fbe9e4; --pron-ink:#8a3a2a;
  --ok:#2e9b62; --ok-soft:#e1f3e8; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 20% -10%,#fff6ee 0%,transparent 60%),var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:720px;margin:0 auto;padding:18px 16px 100px}
.app.wide{max-width:1180px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--muted)}
h1.big{font-family:"Bebas Neue",Impact,sans-serif;font-size:46px;line-height:1;margin:2px 0 12px;letter-spacing:.01em;font-weight:400}
h2.sec{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;letter-spacing:.03em;font-weight:400;margin:0 0 4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:8px 14px;border-radius:999px;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc);font-size:14px}
.pill b{font-weight:700}
.pill.on{box-shadow:0 0 0 3px rgba(224,98,42,.18);border-width:2px}
.pill.ok{background:var(--ok-soft);border-color:#a9dcbf;color:var(--ok)}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.small{font-size:13px}.muted{color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
/* tarjeta con giro */
.flip{margin-bottom:12px}
.flip-in{transition:transform .22s ease-in-out}
.flip.turning .flip-in{transform:perspective(1400px) rotateY(90deg)}
.flip:not(.flipped) .face.back,.flip.flipped .face.front{display:none!important}
.face{min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.face.back{background:#fff4ea}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 14px}
.word{font-family:"Bebas Neue",Impact,sans-serif;font-size:64px;line-height:.95;letter-spacing:.005em;text-align:center;word-break:break-word}
.spk{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--acc-line);background:#fff7f0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.spk svg{width:18px;height:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--pron);border:1px solid #f1c9bd;color:var(--pron-ink);font-size:18px;letter-spacing:.06em;font-weight:500}
.mean{font-size:17px;padding-top:8px}
.field{width:100%;font:inherit;font-size:16px;color:var(--acc);background:#fbeadc;border:1px solid var(--acc-line);border-radius:10px;padding:11px 13px;outline:none}
.field::placeholder{color:#d9a184}
.field:focus{border-color:var(--acc);background:#fff1e6}
textarea.field{min-height:84px;resize:vertical;line-height:1.5}
.sug{font-size:16px;color:var(--acc);background:#fbeadc;border:1px solid var(--acc-line);border-radius:10px;padding:11px 13px;min-height:46px}
.mt{margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;font-weight:600;font-size:15.5px;margin-bottom:10px}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.main{color:#fff;background:linear-gradient(100deg,#e2662b,#d24a22 55%,#c32a1b);box-shadow:0 6px 16px rgba(196,48,28,.28)}
.btn.okb{color:#fff;background:var(--ok)}
.btn svg{width:17px;height:17px}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 10px}
.link{color:var(--acc);font-weight:600;font-size:14px;padding:6px 0}
.link:disabled{opacity:.3}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.barw{height:8px;border-radius:99px;background:#efdfcf;overflow:hidden;margin-top:8px}
.barw i{display:block;height:100%;background:linear-gradient(90deg,#e2662b,#c32a1b)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:6px 0}
.cell{background:rgba(255,250,245,.85);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:78px;overflow:hidden}
.cell.empty{background:transparent;border:0}
.cell .d{font-size:11px;color:var(--muted)}
.cell .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;line-height:1.05;color:#e39a72;min-height:27px}
.cell .r{font-size:13px;font-weight:600;letter-spacing:.06em;color:#a49d97;word-break:break-word}
.cell .r .done{color:var(--ok)}
.cell.today{border:2px solid var(--acc-d);background:#fff}
.cell.today .n,.cell.today .r{color:var(--acc-d)}
.cell .n.done{color:var(--ok)}
.cell.past:not(.today){opacity:.9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 14px}
.legend b{color:var(--ink)}
@media (max-width:560px){
  .word{font-size:52px} h1.big{font-size:40px}
  .g2.stack{grid-template-columns:1fr}
  .cal{gap:3px} .cell{padding:4px 4px;min-height:62px;border-radius:7px}
  .cell .n{font-size:20px;min-height:21px} .cell .r{font-size:10px;letter-spacing:.02em} .cell .d{font-size:9.5px}
  .dow{font-size:10px}
}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,250,245,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;gap:6px;max-width:720px;width:100%}
nav.tabs button{flex:1;padding:10px 0;border-radius:10px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--acc-soft);color:var(--acc)}
.center{text-align:center}
.emoji{font-size:44px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:#fff3dc;margin-bottom:12px}
.hidden{display:none!important}

.tap{cursor:pointer}
.word.es{font-size:54px;margin:8px 0 18px}
.micwrap{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.mic{width:58px;height:58px;flex:none;border-radius:50%;color:#fff;background:linear-gradient(135deg,#e2662b,#c32a1b);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(196,48,28,.3)}
.mic svg{width:26px;height:26px}
.said{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--ink);background:#fff;border:1px solid var(--acc-line);border-radius:12px;padding:14px;outline:none}
.said:focus{border-color:var(--acc)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:17px;text-align:center}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.almost{background:#fff3dc;color:#b7791f}
.verdict.badv{background:#fde8e8;color:#c53030}
.face.front.tap{display:flex;flex-direction:column;justify-content:center}
.ring{position:relative;flex:none}
.ringlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",Impact,sans-serif}
.pgrid{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:start}
.ptotal{display:flex;align-items:center;gap:18px;margin:0}
.pbig{font-family:"Bebas Neue",Impact,sans-serif;font-size:36px;line-height:1}
.pcats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcat{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.pname{font-weight:500;font-size:15px}
@media (max-width:760px){ .pgrid{grid-template-columns:1fr} }
@media (max-width:420px){ .pcats{gap:8px} .pcat{padding:12px 4px} .pname{font-size:13px} .word.es{font-size:44px} }

.mic.rec{background:#d61f1f;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,31,31,.45)}50%{box-shadow:0 0 0 12px rgba(214,31,31,0)}}
.hiddenaid{color:#c9a58f;font-style:italic;background:repeating-linear-gradient(45deg,#fbeadc,#fbeadc 8px,#f8e2d1 8px,#f8e2d1 16px)}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.foot{display:flex;justify-content:center;gap:8px;margin-top:22px;font-size:13px;color:var(--muted)}
.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.face.solo{background:var(--card2)}
</style>
</head>

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const todayStr = () => ymd(new Date());
function dayNum(s){ const [y,m,d]=s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000); }
function fromDayNum(n){ const d=new Date(n*86400000); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
const TODAY = () => dayNum(todayStr());
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];
function shortDate(n){ const d=fromDayNum(n); return d.getDate()+" "+MESES[d.getMonth()]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function wordTxt(id){ const w=ROWS[id][0]; return w==="I"?"I":w.toLowerCase(); }
function meanTxt(id){ const m=ROWS[id][2].toLowerCase(); return m.charAt(0).toUpperCase()+m.slice(1); }

/* ---------- almacenamiento: cuenta (privado) o navegador ---------- */
let DB=null, UID=null;
async function waitClaude(ms){ const t0=Date.now(); while(!(window.claude&&window.claude.use)){ if(Date.now()-t0>ms) return null; await new Promise(r=>setTimeout(r,100)); } return window.claude; }
async function initStore(){
  try{
    const c=await waitClaude(window.top===window?300:4000); if(!c) return;
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(db&&user){ const id=await user.id(); if(id){ DB=db; UID=id; } }
  }catch(e){}
}
function lsGet(k){ try{ const v=localStorage.getItem("i12_"+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem("i12_"+k, JSON.stringify(v)); }catch(e){} }
async function load(k){
  if(DB){ try{ const s=await DB.doc("data/users/"+UID+"/"+k).get(); return s.exists?clone(s.data()):null; }catch(e){ return lsGet(k); } }
  return lsGet(k);
}
const writing={}, pending={};
async function save(k,v){
  lsSet(k,v);
  if(!DB) return;
  pending[k]=clone(v);
  if(writing[k]) return;
  writing[k]=true;
  try{
    while(pending[k]){
      const body=pending[k]; pending[k]=null;
      try{ await DB.doc("data/users/"+UID+"/"+k).set(body); }
      catch(e){
        if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await DB.doc("data/users/"+UID+"/"+k).set(body);}catch(_){} }
        else if(e&&e.code==="quota_exceeded") showNotice("No se ha podido guardar: el espacio de datos está lleno.");
      }
    }
  } finally { writing[k]=false; }
}

/* ---------- estado ---------- */
const DEFAULT = () => ({ startDate: todayStr(), cursor:0, groups:[], newDone:{}, learned:{}, mastered:{}, rev:{}, cand:null });
let S = DEFAULT();
let MINE = {};            // id -> {img, aidw, aid}
const mineLoaded = {};
async function loadState(){
  const st=await load("plan");
  if(st) S=Object.assign(DEFAULT(), st); else await save("plan", S);
}
const persist = () => save("plan", S);
function chunkOf(id){ return Math.floor(id/PER); }
async function loadMine(ids){
  const cs=[...new Set(ids.map(chunkOf))].filter(c=>!mineLoaded[c]);
  await Promise.all(cs.map(async c=>{ const d=await load("mine_"+c); if(d&&d.w) for(const k in d.w) MINE[k]=d.w[k]; mineLoaded[c]=true; }));
}
const mineTimers={};
function saveMineSoon(id){
  const c=chunkOf(id);
  clearTimeout(mineTimers[c]);
  mineTimers[c]=setTimeout(()=>{
    const w={}; for(let i=c*PER;i<Math.min(N,(c+1)*PER);i++) if(MINE[i]) w[i]=MINE[i];
    save("mine_"+c,{w});
    const s=$("#saved"); if(s){ s.classList.add("on"); setTimeout(()=>s.classList.remove("on"),1200); }
  },700);
}

/* ---------- plan ---------- */
const startN = () => dayNum(S.startDate);
function inAnyGroup(id){ return S.groups.some(gr=>gr.includes(id)); }
function progressCount(){ return new Set([...Object.keys(S.learned),...Object.keys(S.mastered)]).size; }
function masteredCount(){ return Object.keys(S.mastered).length; }
function remainingWords(){ const inG=new Set(S.groups.flat()); let n=0; for(let i=S.cursor;i<N;i++) if(!S.mastered[i] && !S.learned[i] && !inG.has(i)) n++; return n; }
function totalGroups(){
  let done=0, openHave=null;
  S.groups.forEach((gr,g)=>{ if(S.newDone[g]) done++; else openHave=gr.length; });
  let rest=remainingWords()+(S.cand!=null?1:0);
  if(openHave!==null){ rest=Math.max(0, rest-(PER-openHave)); done++; }
  return Math.max(1, Math.min(LABELS.length, done+Math.ceil(rest/PER)));
}
function pullNext(){ while(S.cursor<N){ const id=S.cursor++; if(!S.mastered[id] && !S.learned[id] && !inAnyGroup(id)) return id; } return null; }
function migrate(){
  // versión anterior: grupos ya rellenados con 30 palabras sin ver → se quitan las no aprendidas
  let changed=false;
  S.groups.forEach((gr,g)=>{
    if(S.newDone[g]) return;
    const removed=gr.filter(id=>!S.learned[id]);
    if(removed.length){ S.groups[g]=gr.filter(id=>S.learned[id]); S.cursor=Math.min(S.cursor, Math.min(...removed)); changed=true; }
  });
  if(S.cand!=null && (S.mastered[S.cand]||S.learned[S.cand])){ S.cand=null; changed=true; }
  return changed;
}

/* ---------- comprobación de pronunciación (dictado del teclado) ---------- */
const NUMS={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","20":"twenty","100":"hundred"};
const HOMO=[["to","too","two"],["there","their","theyre"],["right","write"],["know","no"],["hear","here"],["see","sea"],["by","buy","bye"],["for","four"],["one","won"],["eight","ate"],["wait","weight"],["week","weak"],["meet","meat"],["son","sun"],["hour","our"],["would","wood"],["whole","hole"],["piece","peace"],["new","knew"],["road","rode"],["red","read"],["its","it's"],["your","youre"],["weather","whether"],["mail","male"],["sale","sail"],["tail","tale"],["pair","pear"],["flower","flour"],["i","eye"],["be","bee"],["blue","blew"],["dear","deer"],["die","dye"],["fair","fare"],["flu","flew"],["hair","hare"],["hi","high"],["made","maid"],["nose","knows"],["not","knot"],["plain","plane"],["rain","reign"],["sell","cell"],["steal","steel"],["through","threw"],["toe","tow"],["waist","waste"],["way","weigh"],["wear","where"],["which","witch"],["break","brake"],["cent","scent","sent"],["night","knight"],["bored","board"],["allowed","aloud"],["missed","mist"]];
function norm(s){
  return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean)
    .map(w=>NUMS[w]||w).join(" ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function homo(a,b){ const A=a.replace(/'/g,""), B=b.replace(/'/g,""); return A===B || HOMO.some(g=>g.includes(A)&&g.includes(B)); }
/* devuelve {level:"ok"|"almost"|"bad"|"empty", heard} */
function checkSaid(id, said){
  const heard=String(said||"").trim();
  const target=norm(ROWS[id][0]), s=norm(heard);
  if(!s) return {level:"empty", heard};
  if(s===target || (" "+s+" ").includes(" "+target+" ")) return {level:"ok", heard};
  const tw=target.split(" "), sw=s.split(" ");
  if(tw.length===1 && sw.some(w=>homo(w,target))) return {level:"ok", heard, homo:true};
  const tol = target.length<=3?0 : target.length<=6?1 : 2;
  let best=lev(s,target);
  if(tw.length===1) sw.forEach(w=>{ best=Math.min(best, lev(w,target)); });
  else for(let i=0;i+tw.length<=sw.length;i++) best=Math.min(best, lev(sw.slice(i,i+tw.length).join(" "),target));
  if(best===0) return {level:"ok", heard};
  if(best<=tol) return {level:"almost", heard};
  return {level:"bad", heard};
}

function revCounts(){
  const pend=pendingReviews(), doneToday=reviewsDoneToday();

    setView(head+`<div class="box center"><div class="emoji">🎉</div><h2 class="sec">¡Has visto todas las palabras!</h2><p class="muted">Sigue con los repasos que marca el calendario.</p></div>`);
    return;
  }
  const grp=S.groups[g];
  // 1) palabra que ha entrado en las 30 y falta aprender
  const toLearn=grp.find(id=>!S.learned[id] && !S.mastered[id]);
  if(toLearn!==undefined){ await renderLearn(g, toLearn, head); return; }
  // 2) ¿grupo lleno?
  const learnedN=grp.filter(id=>S.learned[id]).length;
  if(learnedN>=PER){ S.newDone[g]=todayStr(); TEST=null; await persist(); renderHoy(); return; }
  // 3) siguiente palabra a comprobar
  if(S.cand==null){ S.cand=pullNext(); await persist(); }
  if(S.cand==null){ S.newDone[g]=todayStr(); await persist(); renderHoy(); return; }
  if(!TEST || TEST.id!==S.cand) TEST={id:S.cand, said:"", flipped:false, res:null};
  renderTest(head, g, {
    sub:`Palabra ${learnedN+1} de 30 · grupo ${LABELS[g]}`,
    progress: learnedN/PER,
    onResult: null
  });
}

/* ---------- micrófono: reconocimiento de voz del navegador, o dictado del teclado ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let REC=null;
function bestCheck(id, alts){
  const order={ok:0,almost:1,bad:2,empty:3}; let best=null;
  for(const a of alts){ const r=checkSaid(id,a); if(!best || order[r.level]<order[best.level]) best=r; }
  return best || {level:"empty", heard:""};
}
function micStatus(t){ const e=$("#micStatus"); if(e) e.textContent=t||""; }
function startMic(onDone){
  const inp=$("#said");
  if(MIC_MODE==="sr"){
    try{
      if(REC){ try{ REC.abort(); }catch(_){} REC=null; }
      const rec=new SR(); REC=rec;
      rec.lang="en-US"; rec.interimResults=true; rec.maxAlternatives=5; rec.continuous=false;
      let finalAlts=null;
      $("#bRec").classList.add("rec"); micStatus("Escuchando… di la palabra en inglés");
      rec.onresult=e=>{
        const res=e.results[e.results.length-1]; const arr=[];
        for(let i=0;i<res.length;i++) arr.push(res[i].transcript);
        if(inp) inp.value=arr[0]||"";
        if(res.isFinal){ finalAlts=arr; try{ rec.stop(); }catch(_){} }
      };
      rec.onerror=e=>{
        if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){
          MIC_MODE="kbd"; micStatus(""); showMicHelp(true); if(inp) inp.focus();
        } else if(e.error==="no-speech"){ micStatus("No te he oído. Pulsa el micro otra vez."); }
        else if(e.error!=="aborted"){ micStatus("No he podido escuchar. Prueba otra vez."); }
      };
      rec.onend=()=>{
        REC=null; const b=$("#bRec"); if(b) b.classList.remove("rec");
        if(finalAlts && finalAlts.length){ micStatus(""); TEST.alts=finalAlts; TEST.said=finalAlts[0]; onDone(); }
        else if(MIC_MODE==="sr" && !$("#micStatus")?.textContent.startsWith("No")) micStatus("");
      };
      rec.start();
      return;
    }catch(err){ MIC_MODE="kbd"; }
  }
  showMicHelp(true);
  if(inp){ inp.focus(); try{ inp.select(); }catch(_){} }
}

/* enlaza la tarjeta: rerender() vuelve a pintar la pantalla actual */
function bindTest(rerender){
  const T=TEST, id=T.id, inp=$("#said");
  const flipToBack=()=>{
    if(T.flipped) return;
    if(REC){ try{ REC.abort(); }catch(_){} REC=null; }
    const typed=inp.value;
    if(!T.alts || T.alts[0]!==typed) T.alts=typed.trim()?[typed]:[];
    T.said=typed;
    T.res = T.alts.length ? bestCheck(id, T.alts) : (T.dontKnow?null:{level:"empty",heard:""});
    T.flipped=true;
    speak(ROWS[id][0]);
    turnThen($("#tflip"), rerender);
  };
  T.flipToBack=flipToBack;
  $("#bRec").onclick=e=>{ e.stopPropagation(); startMic(flipToBack); };
  inp.onclick=e=>e.stopPropagation();
  inp.oninput=()=>{ T.said=inp.value; T.alts=null; };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); flipToBack(); } };
  $("#tFront").onclick=()=>flipToBack();
  $("#tBack").onclick=()=>{ if(!T.flipped) return; T.flipped=false; T.dontKnow=false; turnThen($("#tflip"), rerender); };
  const sp=$("#bSpkT"); if(sp) sp.onclick=e=>{ e.stopPropagation(); speak(ROWS[id][0]); };
}

function renderTest(head, g, o){

  const li=$("#bLearnIt"); if(li) li.onclick=async()=>{ S.groups[g].push(id); S.cand=null; TEST=null; POS_FLIP=false; await persist(); renderHoy(); window.scrollTo(0,0); };
  const rt=$("#bRetry"); if(rt) rt.onclick=()=>{ T.flipped=false; T.res=null; T.said=""; T.alts=null; T.dontKnow=false; renderTest(head,g,o); };

/* ---- repasos ----
   1.er repaso (mismo día): tarjeta en inglés como la de aprender, con el AID oculto
   2.º repaso: palabra en castellano → la dices → al girar, inglés + tu AID
   3.er repaso y siguientes: castellano + imagen español + palabras del AID → la dices; sin AID */
function startFree(g){
  const ids=liveIds(g);
  REVQ={free:true, sessions:[], queue:shuffle(ids).map(id=>({id,o:1})), done:new Set(), total:ids.length};
  TEST=null; MODE="rev"; renderHoy();
}
function bindCompleted(g){
  const r=$("#bGoRev"); if(r) r.onclick=()=>{ MODE="rev"; renderHoy(); };
  const f=$("#bFree"); if(f) f.onclick=()=>startFree(g);
}
let REV_AID=false;
const revKind = o => o===0 ? 1 : o===1 ? 2 : 3;
async function renderRev(pend, head, revTot){
  if(!REVQ){
    if(!pend.length){
      const anyNew=currentNewGroup()!==null;
      const today=TODAY()-startN();
      if(!anyNew && S.newDone[today]){ const rc=revCounts(); setView(completedHTML(head, rc)); bindCompleted(today); return; }
      setView(head+`<div class="box center"><div class="emoji">✅</div><h2 class="sec">${revTot?"Repasos de hoy hechos":"Hoy no hay repasos todavía"}</h2>
        <p class="muted">${anyNew?"Primero aprende las palabras nuevas: su repaso aparecerá aquí.":"Vuelve mañana o mira tu progreso."}</p></div>`);
      return;
    }
    const items=[];
    pend.forEach(p=>{ const o=Math.min(...p.keys.map(k=>+k.split("_")[1])); liveIds(p.g).forEach(id=>items.push({id,o})); });
    // primero los del 1.er repaso, luego el resto mezclado
    const first=items.filter(x=>x.o===0), rest=shuffle(items.filter(x=>x.o!==0));
    REVQ={free:false, sessions:pend, queue:first.concat(rest), done:new Set(), total:items.length};
  }
  const Q=REVQ;
  if(!Q.queue.length){
    if(!Q.free){ for(const p of Q.sessions) for(const k of p.keys) S.rev[k]=todayStr(); await persist(); }
    REVQ=null; TEST=null; renderHoy(); return;
  }
  const {id,o}=Q.queue[0];
  await loadMine([id]);
  const m=MINE[id]||{}, r=ROWS[id];
  const kind=revKind(o);
  const img=m.img||r[3]||"", aidw=m.aidw||r[4]||"", aid=m.aid||r[5]||"";
  const title = Q.free ? "Repaso libre · palabras de hoy" : "Repaso · "+Q.sessions.map(p=>LABELS[p.g].toLowerCase()).join(" ");
  const sub = Q.free ? "Di la palabra en inglés y gira la tarjeta." :
    kind===1 ? "1.er repaso: mira la palabra, recuerda tu escena y solo mira el AID si no te sale." :
    kind===2 ? "2.º repaso: di la palabra en inglés y gira la tarjeta." :
               "Repaso sin AID: con tu imagen y tus palabras clave, di la palabra en inglés.";
  const bar=`<div class="box"><h2 class="sec">${esc(title)}</h2><div class="small muted">${sub}</div>
      <div class="barw"><i style="width:${Math.round(Q.done.size/Math.max(1,Q.total)*100)}%"></i></div></div>`;
  const next=()=>{ TEST=null; REV_AID=false; renderHoy(); window.scrollTo(0,0); };
  const finishItem=(ok)=>{
    const it=Q.queue.shift();
    if(ok){ if(!Q.queue.some(x=>x.id===id)) Q.done.add(id); }
    else Q.queue.splice(Math.min(Q.queue.length,4),0,it);
    next();
  };

  if(kind===1 && !Q.free){
    setView(head+bar+`
      <div class="face" style="margin-bottom:12px">
        <div class="wordrow"><div class="word">${esc(wordTxt(id))}</div><button class="spk" id="bSpk">${ICON_SPK}</button></div>
        <div class="g2" style="grid-template-columns:auto 1fr">
          <div><div class="lbl">Pronuncia</div><div class="pr">${esc(r[1]||"—")}</div></div>
          <div><div class="lbl">Significado</div><div class="mean">${esc(meanTxt(id))}</div></div>
        </div>
        <div class="g2 stack mt">
          <div><div class="lbl">Imagen español</div><input class="field" id="rImg" value="${esc(m.img||"")}" placeholder="${esc(r[3]||"Lo que visualizas")}"></div>
          <div><div class="lbl">Imagen inglés</div><input class="field" id="rAidw" value="${esc(m.aidw||"")}" placeholder="${esc(r[4]||"Palabras para el AID")}"></div>
        </div>
        <div class="mt"><div style="display:flex;justify-content:space-between"><div class="lbl">AID: la escena</div><span class="saved" id="saved">Guardado ✓</span></div>
          ${REV_AID?`<textarea class="field" id="rAid" placeholder="${esc(r[5]||"Escribe tu escena")}">${esc(m.aid||"")}</textarea>`:`<div class="sug hiddenaid">Intenta recordar tu escena…</div>`}</div>
      </div>
      <button class="btn line" id="bAid">${REV_AID?ICON_EYEOFF+" Ocultar AID":ICON_EYE+" Ver AID"}</button>
      <button class="btn main" id="bNextR">Lo visualicé</button>`);
    $("#bSpk").onclick=()=>speak(r[0]);
    setTimeout(()=>speak(r[0]),200);
    $("#bAid").onclick=()=>{ REV_AID=!REV_AID; renderHoy(); };
    [["#rImg","img"],["#rAidw","aidw"],["#rAid","aid"]].forEach(([sel,key])=>{ const el=$(sel); if(el) el.oninput=e=>{ MINE[id]=Object.assign({},MINE[id]||{}, {[key]:e.target.value}); saveMineSoon(id); }; });
    $("#bNextR").onclick=()=>finishItem(true);
    return;
  }

  if(!TEST || TEST.id!==id) TEST={id, said:"", flipped:false, res:null};
  const T=TEST;
  const frontExtra = kind===3 && !Q.free ? `<div class="g2 stack" style="margin:-6px 0 14px">
      <div><div class="lbl">Imagen español</div><div class="sug">${esc(img||"—")}</div></div>
      <div><div class="lbl">Palabras usadas</div><div class="row" style="display:flex;gap:8px;align-items:stretch"><div class="sug" style="flex:1">${esc(aidw||"—")}</div>${aidw?`<button class="spk" id="bSpkW" style="align-self:center" aria-label="Escuchar las palabras">${ICON_SPK}</button>`:""}</div></div>
    </div>` : "";
  const backExtra = (kind===2 || Q.free) ? `<div class="mt"><div class="lbl">${m.aid?"Tu AID":"AID sugerido"}</div><div class="sug">${esc(aid||"Sin AID todavía")}</div></div>` : "";
  setView(head+bar+micHelpHTML()+testCardHTML(id, T, {frontExtra, backExtra})+
    (T.flipped?`<div class="g2"><button class="btn line" id="bNo">No me acordaba</button><button class="btn okb" id="bYes">Me acordaba</button></div>`
      :`<button class="btn main" id="bFlipT">Girar tarjeta</button>`)+
    (Q.free?`<button class="btn line" id="bStop">Terminar repaso libre</button>`:""));
  bindMicHelp();
  bindTest(()=>renderHoy());
  const sw=$("#bSpkW"); if(sw) sw.onclick=e=>{ e.stopPropagation(); speakEs(aidw); };
  const bf=$("#bFlipT"); if(bf) bf.onclick=()=>T.flipToBack();
  const y=$("#bYes"); if(y) y.onclick=()=>finishItem(true);
  const n=$("#bNo"); if(n) n.onclick=()=>finishItem(false);
  const st=$("#bStop"); if(st) st.onclick=()=>{ REVQ=null; TEST=null; MODE="new"; renderHoy(); };
}
/* las palabras del AID están en castellano */
function speakEs(text){
  try{
    const s=window.speechSynthesis; if(!s) return; s.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/\+/g,", ")); u.lang="es-ES"; u.rate=0.95;
    const v=VOICES.find(v=>/^es[-_]ES/i.test(v.lang))||VOICES.find(v=>/^es/i.test(v.lang)); if(v) u.voice=v;
    s.speak(u);
  }catch(e){}
}

/* ================= PROGRESO ================= */
const CATS=[["Sustantivos","#4f7ef0"],["Adjetivos","#9b59d0"],["Verbos","#2eaa6b"],["Abstractas","#e0a020"],["Preposiciones","#ec4899"],["Phrasal verbs","#14b8a6"]];
function ring(pct, color, size, stroke, label){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f6ece0" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
      <circle cx="${size/2}" cy="${stroke/2}" r="${stroke/2.2}" fill="${color}"/>
    </svg><div class="ringlbl" style="font-size:${label}px">${Math.round(pct*100)}%</div></div>`;
}
function renderProg(){
  const seen=new Set([...Object.keys(S.learned),...Object.keys(S.mastered)].map(Number));
  const tot=CATS.map(()=>0), got=CATS.map(()=>0);
  ROWS.forEach((r,i)=>{ tot[r[6]]++; if(seen.has(i)) got[r[6]]++; });
  const s=startN(), tg=totalGroups(), lastDay=tg-1+OFFS[OFFS.length-1];
  const firstDow=(fromDayNum(s).getDay()+6)%7;
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(`<div class="cell empty"></div>`);
  const t=TODAY();
  for(let i=0;i<=lastDay;i++){
    const dn=s+i;
    const revs=[]; for(let g=0; g<tg; g++){ const o=i-g; if(OFFS.includes(o)) revs.push({g,o}); }
    const newDone=i<tg && S.newDone[i];
    cells.push(`<div class="cell ${dn===t?"today":""}">
      <div class="d">${shortDate(dn)}</div>
      <div class="n ${newDone?"done":""}">${i<tg?esc(LABELS[i]):""}</div>
      <div class="r">${revs.map(x=>`<span class="${S.rev[x.g+"_"+x.o]?"done":""}">${esc(LABELS[x.g].toLowerCase())}</span>`).join(" ")}</div></div>`);
  }
  setView(`
    <div class="mono">// progreso</div>
    <h1 class="big">Tu progreso</h1>
    <div class="mono" style="margin:6px 0 10px">// vistas · cuántas palabras nuevas ya viste</div>
    <div class="pgrid">
      <div class="box ptotal">${ring(seen.size/N,"#c4401c",96,9,22)}
        <div><div class="muted">Total vistas</div><div class="pbig">${seen.size} / ${N}</div>
        <div class="small muted">${masteredCount()} ya las sabías</div></div></div>
      <div class="pcats">${CATS.map((c,k)=>`<div class="box pcat">${ring(tot[k]?got[k]/tot[k]:0,c[1],60,6,14)}<div class="pname">${c[0]}</div><div class="small muted">${got[k]} / ${tot[k]}</div></div>`).join("")}</div>
    </div>
    <div class="mono" style="margin:18px 0 6px">// tu calendario · grupos de 30 y repasos</div>
    <p style="margin:0 0 12px;font-size:16px">Palabras nuevas hasta el <b>${shortDate(s+tg-1)}</b> · último repaso el <b>${shortDate(s+lastDay)}</b></p>
    <div class="legend"><span><b>MAYÚSCULA</b> = 30 palabras nuevas</span><span><b>minúscula</b> = repaso de ese grupo</span><span style="color:var(--ok)"><b style="color:var(--ok)">verde</b> = hecho</span></div>
    <div class="cal">${["LU","MA","MI","JU","VI","SÁ","DO"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells.join("")}</div>
    <div class="mono" style="margin:22px 0 8px">// opciones</div>
    <div class="box" style="max-width:640px">
      <h2 class="sec">Copia de seguridad</h2>
      <div class="small muted">Guarda tu avance y tus AID antes de borrar el icono, cambiar de móvil o pasar del móvil al ordenador. Luego la cargas en el sitio nuevo.</div>
      <div class="g2 mt"><button class="btn main" id="bkCopy" style="margin:0">Copiar mi copia</button><button class="btn line" id="bkLoad" style="margin:0">Cargar una copia</button></div>
      <div id="bkArea"></div>
    </div>
    <div class="g2" style="max-width:640px"><button class="btn line" id="oToday">↺ Reiniciar el día de hoy</button><button class="btn line" id="oAll">Volver a empezar desde el principio</button></div>`);
  $("#oToday").onclick=resetToday; $("#oAll").onclick=resetAll;
  $("#bkCopy").onclick=backupCopy; $("#bkLoad").onclick=backupLoadUI;
  $("#view").insertAdjacentHTML("beforeend", `<div class="foot mono">versión ${APP_VERSION}</div>`);
}

async function buildBackup(){
  const mine={};
  for(let c=0;c<Math.ceil(N/PER);c++){ const d=await load("mine_"+c); if(d&&d.w&&Object.keys(d.w).length) mine[c]=d.w; }
  return JSON.stringify({app:"ingles12", v:1, fecha:todayStr(), plan:S, mine});
}
async function backupCopy(){
  const btn=$("#bkCopy"); btn.disabled=true;
  const txt=await buildBackup();
  let copied=false;
  try{ await navigator.clipboard.writeText(txt); copied=true; }catch(e){}
  btn.disabled=false;
  $("#bkArea").innerHTML=`<div class="note mt" style="margin-bottom:0">${copied?"<b>Copiada ✓</b> Pégala en Notas, en un correo o en un WhatsApp a ti mismo para guardarla.":"Selecciona todo el texto de abajo, cópialo y guárdalo en Notas o en un correo."}</div>
    <textarea class="field mt" readonly style="min-height:90px;font-size:12px;color:var(--ink)">${esc(txt)}</textarea>`;
  const ta=$("#bkArea textarea"); ta.onclick=()=>ta.select();
}
function backupLoadUI(){
  $("#bkArea").innerHTML=`<textarea class="field mt" id="bkIn" placeholder="Pega aquí tu copia de seguridad" style="min-height:90px;font-size:12px;color:var(--ink)"></textarea>
    <button class="btn main mt" id="bkGo" style="margin-bottom:0">Cargar esta copia</button><div id="bkMsg"></div>`;
  $("#bkGo").onclick=async()=>{
    let d=null; try{ d=JSON.parse($("#bkIn").value.trim()); }catch(e){}
    if(!d || d.app!=="ingles12" || !d.plan){ $("#bkMsg").innerHTML=`<div class="note mt" style="background:#fde8e8">Esto no parece una copia de la app. Pégala entera, desde la primera llave { hasta la última }.</div>`; return; }
    const a=await confirmBox("Cargar la copia",`Se sustituye el avance de este aparato por el de la copia del ${esc(d.fecha||"")}.`,"Cargar");
    if(!a) return;
    S=Object.assign(DEFAULT(), d.plan); await persist();
    MINE={}; for(let c=0;c<Math.ceil(N/PER);c++){ const w=(d.mine&&d.mine[c])||{}; mineLoaded[c]=true; for(const k in w) MINE[k]=w[k]; await save("mine_"+c,{w}); }
    SNAP={date:todayStr(), state:clone(S)}; await save("snap",SNAP);
    REVQ=null; TEST=null; MODE=null; go("hoy");
  };
}

/* ---------- actualización automática (solo en la web propia) ---------- */
async function checkUpdate(){
  if(window.top!==window || !/^https?:/.test(location.protocol)) return;
  try{
    const url=location.href.split("#")[0].split("?")[0];
    const r=await fetch(url+"?t="+Date.now(), {cache:"no-store"}); if(!r.ok) return;
    const m=(await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if(m && m[1]!==APP_VERSION){
      let tried=null; try{ tried=sessionStorage.getItem("i12_upd"); }catch(e){}
      if(tried===m[1]) return;
      try{ sessionStorage.setItem("i12_upd", m[1]); }catch(e){}
      const busy=document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if(busy){ showNotice("Hay una versión nueva de la app. Se cargará la próxima vez que la abras."); return; }
      location.replace(url+"?v="+encodeURIComponent(m[1]));
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });

(async function boot(){
  await initStore();
  await loadState();
  if(migrate()) await persist();
  await initSnapshot();
  if(!DB) showNotice("Modo local: el progreso se guarda solo en este navegador.");
  go("hoy");
  checkUpdate();
})();

</script>
